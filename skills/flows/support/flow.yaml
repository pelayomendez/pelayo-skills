schema: yatsude/flow@1
name: support
version: 1.0.0
summary: Takes bugs from report to released
trust: core
requires:
  yatsude: '>=0.21'
  config:
  - Tracker
  - Board
  - Repo
  - Load limits
  - App
  - Release
  - <tasks>
units:
  steps:
  - qualify
  - code-check
  - verify-claim
  - ticket-pick
  - delegate
  - ui-check
  - watch
  throughout:
  - charter
  - tracker-move
  - handoff
slots:
- name: implement
  via: delegate
- name: review
  via: review-change
- name: browser-check
  via: ui-check
effects:
- push
- open-mr
- merge
- post
- release
- deploy
- tracker-write
stops:
- id: pick-bugs
  after: code-check
  guards: []
  asks: which ready bug to take first
- id: review-cap
  after: delegate
  guards: []
  asks: what to do after three review rounds
- id: merge
  after: ui-check
  guards:
  - merge
  - release
  - deploy
  asks: merge this MR at this head
- id: tell-reporter
  after: watch
  guards:
  - post
  asks: the exact text for the reporter
permissions:
  charter:
  - push
  - open-mr
  - merge
  - post
  - release
  - deploy
  - tracker-write
on_failure: true
