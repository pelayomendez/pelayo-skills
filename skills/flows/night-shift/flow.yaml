schema: yatsude/flow@1
name: night-shift
version: 1.0.0
summary: Works tickets while you are away
trust: core
requires:
  yatsude: '>=0.21'
  config: []
units:
  steps:
  - order-backlog
  - reap-procs
  - delegate
  - review-change
  - ui-check
  - verify-claim
  throughout:
  - charter
  - watch
  - handoff
slots:
- name: implement
  via: delegate
- name: review
  via: review-change
- name: browser-check
  via: ui-check
effects:
- push
- open-mr
- merge
- post
- tracker-write
- install
- deploy
stops:
- id: decision-round
  after: start
  guards: []
  asks: tonight's push, merge, queue, package bumps and product calls
permissions:
  charter:
  - push
  - open-mr
  - merge
  - post
  - tracker-write
  - install
  - deploy
  - kill
  - delete
on_failure: true
